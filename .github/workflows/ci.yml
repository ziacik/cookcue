name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Test and build
        run: |
          if ! gradle --no-daemon :core:testDebugUnitTest :core:lintDebug :mobile:lintDebug :wear:lintDebug :mobile:assembleDebug :wear:assembleDebug; then
            find . -path '*/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt' -print -exec cat {} \;
            exit 1
          fi
