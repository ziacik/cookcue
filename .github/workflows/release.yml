name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Read release version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a semantic-version tag such as v0.9.0"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( major > 2000 || minor > 999 || patch > 999 )); then
            echo "::error::Version exceeds supported versionCode range"
            exit 1
          fi
          version_code=$(( major * 1000000 + minor * 1000 + patch ))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "::error::Invalid Android versionCode: $version_code"
            exit 1
          fi

          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Set all four ANDROID_RELEASE_* repository secrets before tagging a release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cookcue-release.jks"
          chmod 600 "$RUNNER_TEMP/cookcue-release.jks"

      - name: Test, lint and build signed APKs
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/cookcue-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon \
            -PreleaseVersionName="${{ steps.version.outputs.name }}" \
            -PreleaseVersionCode="${{ steps.version.outputs.code }}" \
            :core:testDebugUnitTest :core:lintDebug \
            :mobile:lintRelease :wear:lintRelease \
            :mobile:assembleRelease :wear:assembleRelease

      - name: Verify signatures and stage APKs
        shell: bash
        run: |
          mkdir -p release
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          for module in mobile wear; do
            apk="$module/build/outputs/apk/release/$module-release.apk"
            test -f "$apk"
            "$apksigner" verify --verbose "$apk"
            cp "$apk" "release/CookCue-$module-$GITHUB_REF_NAME.apk"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CookCue ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/CookCue-mobile-*.apk
            release/CookCue-wear-*.apk
